[package]
name = "git-changelist"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "Deterministic Git/GitHub version fact extractor and changelog classifier for developers and AI agents"
license = "MIT"
repository = "https://github.com/yuxuetr/changelog"
readme = "README.md"
keywords = ["git", "changelog", "release", "tags", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**/*", "skills/**/*", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
