[package]
name = "taglens"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "See what each Git tag / GitHub release changed: commits grouped into features, fixes and breaking changes"
repository = "https://github.com/yuxuetr/changelog"
readme = "README.md"
keywords = ["git", "changelog", "release", "tags", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
